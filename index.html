<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b2424" />
  <meta name="description" content="دستیار هوشمند گردشگری و میراث فرهنگی سلطانیه" />
  <title>راهنمای هوشمند سلطانیه</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-512x512.png" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #0b2424;
      color: #faf6ee;
      direction: rtl;
      text-align: right;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(224, 184, 98, 0.35);
      border-radius: 20px;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      color: #e0b862;
      font-size: 1.5rem;
    }
    p {
      line-height: 1.8;
      color: #e2ecee;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>راهنمای هوشمند سلطانیه</h1>
    <p>دستیار هوشمند گردشگری و میراث فرهنگی سلطانیه آماده ارائه خدمات به صورت آفلاین و آنلاین است.</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js').catch(function (err) {
          console.warn('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
